name: Release

# Builds on minor and major version tags only -- never on a patch.
#
# The tag pattern does the filtering, with no scripting: a semver tag whose
# patch component is `0` *is* a minor or major bump.
#
#   v0.1.0  -> matches, builds        (minor)
#   v1.0.0  -> matches, builds        (major)
#   v0.1.1  -> does not match, quiet  (patch)
#
# Expressing the rule as a pattern rather than a conditional means there is no
# runtime logic to get wrong, and the behaviour is obvious from reading the file.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.0'
  # So the build path can be exercised without cutting a real release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A shipped bundle whose internal version disagrees with its tag is the kind
  # of thing nobody notices until a bug report cites the wrong build. Catch it
  # before spending twenty minutes on three platform builds.
  check-version:
    name: Tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag against Cargo.toml and tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tauri_version="$(grep -m1 '"version"' crates/dj-app/tauri.conf.json | cut -d'"' -f4)"

          echo "tag:          $tag"
          echo "Cargo.toml:   $cargo_version"
          echo "tauri.conf:   $tauri_version"

          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$tauri_version" ]; then
            echo "::error::Tag $tag disagrees with the manifests. Bump both and re-tag."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          # Intel Macs are still booth workhorses; an arm64-only release would
          # leave a lot of working DJs without a build.
          - os: macos-13
            name: macOS (Intel)
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            name: Linux (x86_64)
            args: ''
            target: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Install Linux audio and webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # tauri-build refuses to compile dj-app without the frontend bundle, so
      # the UI is built before cargo is invoked at all.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/dj-app
          tagName: ${{ github.ref_name }}
          releaseName: djmanzo ${{ github.ref_name }}
          releaseBody: |
            ## djmanzo ${{ github.ref_name }}

            | Platform | Download |
            |---|---|
            | macOS, Apple Silicon | `.dmg` (aarch64) |
            | macOS, Intel | `.dmg` (x86_64) |
            | Linux | `.deb` and `.AppImage` |

            ### Before you run it

            These builds are **unsigned and un-notarised**. macOS will refuse to
            open the app on first launch until you right-click it and choose
            Open, or clear the quarantine attribute. Signing needs an Apple
            Developer ID, which is an account question rather than a code one.
            Linux is unaffected.

            See [CHANGELOG.md](https://github.com/joehannes/djmanzo/blob/main/CHANGELOG.md)
            for what changed.
          # Draft, so a human decides what actually ships.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
