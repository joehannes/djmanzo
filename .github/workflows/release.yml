name: Release

# Builds on minor and major version tags only -- never on a patch.
#
# The tag pattern does the filtering, with no scripting: a semver tag whose
# patch component is `0` *is* a minor or major bump.
#
#   v0.1.0  -> matches, builds        (minor)
#   v1.0.0  -> matches, builds        (major)
#   v0.1.1  -> does not match, quiet  (patch)
#
# Expressing the rule as a pattern rather than a conditional means there is no
# runtime logic to get wrong, and the behaviour is obvious from reading the file.
on:
  push:
    branches:
      - add-windows-support
    tags:
      - 'v*.*.*'
  # So the build path can be exercised without cutting a real release — and so
  # an installable package can be had on demand. A dispatch run publishes
  # nothing: it uploads the bundles as workflow artifacts, downloadable from the
  # run's own page. Creating a release needs a tag, and a tag is a decision.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which builds to produce'
        type: choice
        default: all
        options:
          - linux
          - all

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A shipped bundle whose internal version disagrees with its tag is the kind
  # of thing nobody notices until a bug report cites the wrong build. Catch it
  # before spending twenty minutes on three platform builds.
  check-version:
    name: Tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag against Cargo.toml and tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tauri_version="$(grep -m1 '"version"' crates/dj-app/tauri.conf.json | cut -d'"' -f4)"

          echo "tag:          $tag"
          echo "Cargo.toml:   $cargo_version"
          echo "tauri.conf:   $tauri_version"

          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$tauri_version" ]; then
            echo "::error::Tag $tag disagrees with the manifests. Bump both and re-tag."
            exit 1
          fi

  # Which builds this run wants.
  #
  # The matrix is data rather than YAML because a job-level `if` cannot see the
  # `matrix` context — so a run asking only for a Debian package has to be
  # given a shorter matrix rather than a longer one that skips itself.
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          # Intel Macs are still booth workhorses; an arm64-only release would
          # leave a lot of working DJs without a build.
          ALL: >-
            [{"os":"windows-latest","name":"Windows (x86_64)","args":"","target":""},
             {"os":"ubuntu-latest","name":"Linux (x86_64)","args":"","target":""}]
          LINUX: >-
            [{"os":"ubuntu-latest","name":"Linux (x86_64)","args":"","target":""}]
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platforms }}" = "linux" ]; then
            chosen="$LINUX"
          else
            chosen="$ALL"
          fi
          echo "matrix=$(echo "$chosen" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [check-version, plan]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      # libclang is for bindgen, which builds the keylock bindings; the rest is
      # ALSA and the GTK/WebKit stack Tauri links against.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # tauri-build refuses to compile dj-app without the frontend bundle, so
      # the UI is built before cargo is invoked at all.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Debug Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd crates/dj-app && npx -y @tauri-apps/cli@2 build > ../../check_log.txt 2>&1 || true
          cd ../..
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add check_log.txt
          git commit -m "chore: upload check_log.txt" || true
          git push origin HEAD:add-windows-support

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/dj-app
          # Empty on a dispatch: no tag, so no release, just a build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: djmanzo ${{ github.ref_name }}
          releaseBody: |
            ## djmanzo ${{ github.ref_name }}

            | Platform | Download |
            |---|---|
            | macOS, Apple Silicon | `.dmg` (aarch64) |
            | macOS, Intel | `.dmg` (x86_64) |
            | Linux | `.deb` and `.AppImage` |

            ### Before you run it

            These builds are **unsigned and un-notarised**. macOS will refuse to
            open the app on first launch until you right-click it and choose
            Open, or clear the quarantine attribute. Signing needs an Apple
            Developer ID, which is an account question rather than a code one.
            Linux is unaffected.

            See [CHANGELOG.md](https://github.com/joehannes/djmanzo/blob/main/CHANGELOG.md)
            for what changed.
          # Draft, so a human decides what actually ships.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # What a dispatch run is for. The bundles land on the run's page rather
      # than in a release, so an installable package can be had without a tag —
      # which is what cutting a release actually means.
      - name: Upload the bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: djmanzo-${{ matrix.target || 'x86_64-unknown-linux-gnu' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
