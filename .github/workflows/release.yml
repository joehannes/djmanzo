name: Release

# Builds on minor and major version tags only -- never on a patch.
#
# The tag pattern does the filtering, with no scripting: a semver tag whose
# patch component is `0` *is* a minor or major bump.
#
#   v0.1.0  -> matches, builds        (minor)
#   v1.0.0  -> matches, builds        (major)
#   v0.1.1  -> does not match, quiet  (patch)
#
# Expressing the rule as a pattern rather than a conditional means there is no
# runtime logic to get wrong, and the behaviour is obvious from reading the file.
on:
  push:
    tags:
      # `0` in the patch position, because that is what makes a tag a minor or
      # major bump. `v*.*.*` was here instead, which matches every patch tag
      # too -- so the rule the comment above states, and CHANGELOG.md repeats,
      # was not the rule being enforced.
      - 'v[0-9]+.[0-9]+.0'
  # So the build path can be exercised without cutting a real release — and so
  # an installable package can be had on demand.
  #
  # With no `tag`, a dispatch publishes nothing: the bundles land as workflow
  # artifacts on the run's own page, which needs a GitHub login to reach.
  #
  # **With a `tag`, it cuts a real release**, and that is deliberate rather than
  # a convenience. Creating a tag requires push permission for `refs/tags/*`,
  # which not every context that can run this workflow has — so a release used
  # to require pushing a tag by hand from a machine that did. The runner's own
  # `GITHUB_TOKEN` has `contents: write`, and `tauri-action` creates the tag and
  # the release with it, so the workflow can do what the person triggering it
  # may not be able to. The version check below still applies: the tag has to
  # agree with the manifests either way.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which builds to produce'
        type: choice
        default: all
        options:
          - linux
          - all
      tag:
        description: 'Cut a release at this tag, e.g. v0.8.0. Leave empty to build without releasing.'
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A shipped bundle whose internal version disagrees with its tag is the kind
  # of thing nobody notices until a bug report cites the wrong build. Catch it
  # before spending twenty minutes on three platform builds.
  check-version:
    name: Tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag against Cargo.toml and tauri.conf.json
        # A dispatch that names a tag is cutting a release, so it is checked on
        # exactly the same terms as a tag push. A dispatch with no tag has
        # nothing to check.
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          WANTED: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${WANTED#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tauri_version="$(grep -m1 '"version"' crates/dj-app/tauri.conf.json | cut -d'"' -f4)"

          echo "tag:          $tag"
          echo "Cargo.toml:   $cargo_version"
          echo "tauri.conf:   $tauri_version"

          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$tauri_version" ]; then
            echo "::error::Tag $tag disagrees with the manifests. Bump both and try again."
            exit 1
          fi

  # Which builds this run wants.
  #
  # The matrix is data rather than YAML because a job-level `if` cannot see the
  # `matrix` context — so a run asking only for a Debian package has to be
  # given a shorter matrix rather than a longer one that skips itself.
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          # Intel Macs are still booth workhorses; an arm64-only release would
          # leave a lot of working DJs without a build.
          ALL: >-
            [{"os":"macos-latest","name":"macOS (Apple Silicon)","args":"--target aarch64-apple-darwin","target":"aarch64-apple-darwin","artifact":"macos-aarch64"},
             {"os":"macos-latest","name":"macOS (Intel)","args":"--target x86_64-apple-darwin","target":"x86_64-apple-darwin","artifact":"macos-x86_64"},
             {"os":"windows-latest","name":"Windows (x86_64)","args":"","target":"","artifact":"windows-x86_64"},
             {"os":"ubuntu-latest","name":"Linux (x86_64)","args":"","target":"","artifact":"linux-x86_64"}]
          LINUX: >-
            [{"os":"ubuntu-latest","name":"Linux (x86_64)","args":"","target":"","artifact":"linux-x86_64"}]
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platforms }}" = "linux" ]; then
            chosen="$LINUX"
          else
            chosen="$ALL"
          fi
          echo "matrix=$(echo "$chosen" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [check-version, plan]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      # libclang is for bindgen, which builds the keylock bindings; the rest is
      # ALSA and the GTK/WebKit stack Tauri links against.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - name: Set LIBCLANG_PATH for Windows
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # tauri-build refuses to compile dj-app without the frontend bundle, so
      # the UI is built before cargo is invoked at all.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/dj-app
          # The tag being released, from whichever way this run started. Empty
          # on a dispatch that named none, and then `tauri-action` builds
          # without touching releases at all.
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: djmanzo ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            ## djmanzo ${{ inputs.tag || github.ref_name }}

            | Platform | Download |
            |---|---|
            | macOS, Apple Silicon | `.dmg` (aarch64) |
            | macOS, Intel | `.dmg` (x86_64) |
            | Linux | `.deb` and `.AppImage` |
            | Windows | `.msi` and `.exe` |

            ### Before you run it

            These builds are **unsigned and un-notarised**. macOS will refuse to
            open the app on first launch until you right-click it and choose
            Open, or clear the quarantine attribute. Signing needs an Apple
            Developer ID, which is an account question rather than a code one.
            Linux is unaffected.

            See [CHANGELOG.md](https://github.com/joehannes/djmanzo/blob/main/CHANGELOG.md)
            for what changed.
          # **A dispatch that names a tag publishes; a tag push drafts.**
          #
          # Not an inconsistency. Pushing a tag is something that happens as
          # part of ordinary work and can happen by accident, so it produces a
          # draft and waits for a person. Filling in a tag on the Run workflow
          # form is nobody's accident — it is a deliberate act with the tag
          # typed out — so it produces a release people can actually download.
          #
          # A draft release is invisible to anyone without write access, which
          # made the `.deb` unreachable for exactly the people it is for.
          releaseDraft: ${{ inputs.tag == '' }}
          prerelease: false
          args: ${{ matrix.args }}

      # A dispatch with no tag has nowhere else to put the bundles, so they go
      # on the run's page. A tagged one has a release, and uploading the same
      # files twice would only make it ambiguous which copy is the real one.
      - name: Upload the bundles
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          # Named per platform, not derived from `matrix.target`. Windows and
          # Linux both leave `target` empty -- neither needs a cross-compile
          # triple -- so the old fallback uploaded the **Windows** bundle under
          # the name `djmanzo-x86_64-unknown-linux-gnu`, and whoever downloaded
          # the Linux package had even odds of getting an `.msi`.
          name: djmanzo-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
