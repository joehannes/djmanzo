name: Release

# Builds on minor and major version tags only -- never on a patch.
#
# The tag pattern does the filtering, with no scripting: a semver tag whose
# patch component is `0` *is* a minor or major bump.
#
#   v0.1.0  -> matches, builds        (minor)
#   v1.0.0  -> matches, builds        (major)
#   v0.1.1  -> does not match, quiet  (patch)
#
# Expressing the rule as a pattern rather than a conditional means there is no
# runtime logic to get wrong, and the behaviour is obvious from reading the file.
on:
  push:
    tags:
      # `0` in the patch position, because that is what makes a tag a minor or
      # major bump. `v*.*.*` was here instead, which matches every patch tag
      # too -- so the rule the comment above states, and CHANGELOG.md repeats,
      # was not the rule being enforced.
      - 'v[0-9]+.[0-9]+.0'
  # So the build path can be exercised without cutting a real release — and so
  # an installable package can be had on demand.
  #
  # With no `tag`, a dispatch publishes nothing: the bundles land as workflow
  # artifacts on the run's own page, which needs a GitHub login to reach.
  #
  # **With a `tag`, it cuts a real release**, and that is deliberate rather than
  # a convenience. Creating a tag requires push permission for `refs/tags/*`,
  # which not every context that can run this workflow has — so a release used
  # to require pushing a tag by hand from a machine that did. The runner's own
  # `GITHUB_TOKEN` has `contents: write`, and `tauri-action` creates the tag and
  # the release with it, so the workflow can do what the person triggering it
  # may not be able to. The version check below still applies: the tag has to
  # agree with the manifests either way.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which builds to produce'
        type: choice
        default: all
        options:
          - linux
          - karaoke
          - all
      tag:
        description: 'Cut a release at this tag, e.g. v0.8.0. Leave empty to build without releasing.'
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A shipped bundle whose internal version disagrees with its tag is the kind
  # of thing nobody notices until a bug report cites the wrong build. Catch it
  # before spending twenty minutes on three platform builds.
  check-version:
    name: Tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag against Cargo.toml and tauri.conf.json
        # A dispatch that names a tag is cutting a release, so it is checked on
        # exactly the same terms as a tag push. A dispatch with no tag has
        # nothing to check.
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          WANTED: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${WANTED#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tauri_version="$(grep -m1 '"version"' crates/dj-app/tauri.conf.json | cut -d'"' -f4)"

          echo "tag:          $tag"
          echo "Cargo.toml:   $cargo_version"
          echo "tauri.conf:   $tauri_version"

          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$tauri_version" ]; then
            echo "::error::Tag $tag disagrees with the manifests. Bump both and try again."
            exit 1
          fi

  # Which builds this run wants.
  #
  # The matrix is data rather than YAML because a job-level `if` cannot see the
  # `matrix` context — so a run asking only for a Debian package has to be
  # given a shorter matrix rather than a longer one that skips itself.
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          # Intel Macs are still booth workhorses; an arm64-only release would
          # leave a lot of working DJs without a build.
          #
          # `--config tauri.onnxruntime.conf.json` carries ONNX Runtime into the
          # Windows and Apple Silicon packages, so the neural stem separator
          # works there without the DJ installing anything; the Linux packages
          # carry theirs through tauri.linux.conf.json. The Intel Mac build has
          # none to carry -- Microsoft publishes no ONNX Runtime new enough for
          # it -- and uses the built-in separator. Resolved from projectPath,
          # the directory tauri-action runs the build in.
          ALL: >-
            [{"os":"macos-latest","name":"macOS (Apple Silicon)","args":"--target aarch64-apple-darwin --config tauri.onnxruntime.conf.json","target":"aarch64-apple-darwin","artifact":"macos-aarch64","onnxruntime":"macos"},
             {"os":"macos-latest","name":"macOS (Intel)","args":"--target x86_64-apple-darwin","target":"x86_64-apple-darwin","artifact":"macos-x86_64","onnxruntime":""},
             {"os":"windows-latest","name":"Windows (x86_64)","args":"--config tauri.onnxruntime.conf.json","target":"","artifact":"windows-x86_64","onnxruntime":"windows"},
             {"os":"ubuntu-latest","name":"Linux (x86_64)","args":"","target":"","artifact":"linux-x86_64","onnxruntime":""},
             {"os":"macos-latest","name":"macOS Karaoke (Intel, 10.13+)","args":"--target x86_64-apple-darwin --config tauri.karaoke.conf.json -- --no-default-features","target":"x86_64-apple-darwin","artifact":"macos-karaoke-x86_64","onnxruntime":"","deployment":"10.13","karaoke":"yes"}]
          # The karaoke build for older Intel Macs, back to a 2011 laptop on
          # macOS 10.13 (High Sierra): without whisper.cpp, which needs 10.15
          # (`--no-default-features` drops the `whisper` feature), its own name
          # and settings (tauri.karaoke.conf.json), and the interface lowered to
          # Safari 13's WebKit (`npm run build:karaoke`).
          KARAOKE: >-
            [{"os":"macos-latest","name":"macOS Karaoke (Intel, 10.13+)","args":"--target x86_64-apple-darwin --config tauri.karaoke.conf.json -- --no-default-features","target":"x86_64-apple-darwin","artifact":"macos-karaoke-x86_64","onnxruntime":"","deployment":"10.13","karaoke":"yes"}]
          LINUX: >-
            [{"os":"ubuntu-latest","name":"Linux (x86_64)","args":"","target":"","artifact":"linux-x86_64","onnxruntime":""}]
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platforms }}" = "linux" ]; then
            chosen="$LINUX"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platforms }}" = "karaoke" ]; then
            chosen="$KARAOKE"
          else
            chosen="$ALL"
          fi
          echo "matrix=$(echo "$chosen" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [check-version, plan]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      # libclang is for bindgen, which builds the keylock bindings; the rest is
      # ALSA and the GTK/WebKit stack Tauri links against.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      # The oldest macOS a build runs on is the one it is compiled for:
      # `.cargo/config.toml` pins 10.15 for whisper.cpp, and an environment
      # variable set here wins over it (cargo's `[env]` never overrides one
      # already set). The C compilers read the same variable.
      - name: Compile for an older macOS
        if: matrix.deployment
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment }}" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH for Windows
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # tauri-build refuses to compile dj-app without the frontend bundle, so
      # the UI is built before cargo is invoked at all.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/dj-app
          # The tag being released, from whichever way this run started. Empty
          # on a dispatch that named none, and then `tauri-action` builds
          # without touching releases at all.
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: djmanzo ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            ## djmanzo ${{ inputs.tag || github.ref_name }}

            | Platform | Download |
            |---|---|
            | macOS, Apple Silicon | `.dmg` (aarch64) |
            | macOS, Intel | `.dmg` (x86_64) |
            | macOS Karaoke, Intel, back to 10.13 (2011 laptops) | `djmanzo Karaoke` `.dmg` (x86_64) |
            | Linux | `.deb`, `.rpm` and `.AppImage` |
            | Windows | `.msi` and `.exe` |

            macOS also gets a `.app.tar.gz` of each build. It is the same
            application as the `.dmg` beside it, for anyone who would rather
            unpack it than mount a disk image.

            ### Before you run it

            These builds are **unsigned and un-notarised**. macOS will refuse to
            open the app on first launch until you right-click it and choose
            Open, or clear the quarantine attribute. Signing needs an Apple
            Developer ID, which is an account question rather than a code one.
            Linux is unaffected.

            See [CHANGELOG.md](https://github.com/joehannes/djmanzo/blob/main/CHANGELOG.md)
            for what changed.
          # **A dispatch that names a tag publishes; a tag push drafts.**
          #
          # Not an inconsistency. Pushing a tag is something that happens as
          # part of ordinary work and can happen by accident, so it produces a
          # draft and waits for a person. Filling in a tag on the Run workflow
          # form is nobody's accident — it is a deliberate act with the tag
          # typed out — so it produces a release people can actually download.
          #
          # A draft release is invisible to anyone without write access, which
          # made the `.deb` unreachable for exactly the people it is for.
          releaseDraft: ${{ inputs.tag == '' }}
          prerelease: false
          args: ${{ matrix.args }}

      # A package that says it carries ONNX Runtime and does not is the
      # v0.23.0 failure again on another platform: stems that cannot load, on
      # a machine where nobody can see why. So the run fails rather than
      # passing. Checked where each bundler reads its file list from, because
      # that is what ends up installed.
      - name: The Apple Silicon app carries ONNX Runtime
        if: matrix.onnxruntime == 'macos'
        run: |
          set -euo pipefail
          lib="target/${{ matrix.target }}/release/bundle/macos/djmanzo.app/Contents/Resources/onnxruntime/libonnxruntime.1.dylib"
          test -f "$lib" || { echo "::error::$lib is not in the app"; exit 1; }
          file "$lib"
          file "$lib" | grep -q arm64

      # A karaoke app that names 10.13 and cannot start there is the v0.34.0
      # failure on a machine nobody here can test on. So what can be read from
      # the bundle is read: the oldest macOS the binary and its Info.plist
      # say, that nothing of C++'s std::filesystem (10.15) is called for, and
      # that no framework newer than 10.13 is linked unconditionally.
      - name: The karaoke app is built to start on macOS 10.13
        if: matrix.karaoke == 'yes'
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/djmanzo Karaoke.app"
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          plist_min="$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          echo "Info.plist minimum: $plist_min"
          test "$plist_min" = "10.13" || { echo "::error::Info.plist says $plist_min"; exit 1; }
          otool -l "$bin" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | tee /tmp/min.txt
          grep -qE '(minos|version) 10\.13' /tmp/min.txt || { echo "::error::the binary is not built for 10.13"; exit 1; }
          if nm -u "$bin" | grep -E '__fs10filesystem|whisper_'; then
            echo "::error::the binary calls what 10.13 has not got"; exit 1
          fi
          otool -L "$bin" | tee /tmp/linked.txt
          for newer in UniformTypeIdentifiers ScreenCaptureKit Network.framework UserNotifications CryptoKit Combine SwiftUI libswiftCore; do
            if otool -l "$bin" | grep -B1 -A2 'LC_LOAD_DYLIB$' | grep -q "$newer"; then
              echo "::error::$newer is linked unconditionally and is not on 10.13"; exit 1
            fi
          done
          echo "Built for 10.13: minimum, symbols and frameworks checked."

      # Speech recognition is whisper.cpp in a helper beside the app, built for
      # 10.15, which the app runs only where this Mac can (`dj_app::listening`).
      # So it must be in the bundle, built for 10.15, and start and answer: on
      # this runner that is the probe's "ready", or its refusal where the
      # processor lacks AVX2 — either is the helper running; silence is not.
      - name: The karaoke app carries its speech recognition helper
        if: matrix.karaoke == 'yes'
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/djmanzo Karaoke.app"
          helper="$app/Contents/MacOS/djmanzo-listen"
          test -x "$helper" || { echo "::error::$helper is not in the app"; exit 1; }
          file "$helper" | tee /tmp/helper-file.txt
          grep -q x86_64 /tmp/helper-file.txt || { echo "::error::the helper is not x86_64"; exit 1; }
          otool -l "$helper" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | tee /tmp/helper-min.txt
          grep -qE '(minos|version) 10\.15' /tmp/helper-min.txt || { echo "::error::the helper is not built for 10.15"; exit 1; }
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            said="$(arch -x86_64 "$helper" --probe </dev/null)"
          else
            said="$("$helper" --probe </dev/null)"
          fi
          echo "The helper said: $said"
          case "$said" in
            '"ready"'|'{"refused":'*) echo "The helper starts and answers." ;;
            *) echo "::error::the helper did not answer its probe"; exit 1 ;;
          esac

      - name: The Windows installers carry ONNX Runtime
        if: matrix.onnxruntime == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for listing in target/release/nsis/x64/installer.nsi target/release/wix/x64/main.wxs; do
            grep -q 'onnxruntime.dll' "$listing" \
              || { echo "::error::$listing does not install onnxruntime.dll"; exit 1; }
            echo "$listing installs onnxruntime.dll"
          done

      # A dispatch with no tag has nowhere else to put the bundles, so they go
      # on the run's page. A tagged one has a release, and uploading the same
      # files twice would only make it ambiguous which copy is the real one.
      - name: Upload the bundles
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          # Named per platform, not derived from `matrix.target`. Windows and
          # Linux both leave `target` empty -- neither needs a cross-compile
          # triple -- so the old fallback uploaded the **Windows** bundle under
          # the name `djmanzo-x86_64-unknown-linux-gnu`, and whoever downloaded
          # the Linux package had even odds of getting an `.msi`.
          name: djmanzo-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
