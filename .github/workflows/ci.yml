name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings. Cheap to keep clean from day one, miserable to
  # retrofit later.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints are platform-independent, so they run once rather than
  # on both matrix legs.
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # libclang is for bindgen, which builds the keylock bindings; the rest is
      # ALSA and the GTK/WebKit stack Tauri links against.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - run: cargo fmt --all --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # tauri-build wants the frontend bundle to exist before it will compile
      # dj-app, so the UI is built even for a lint-only run.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      # The scene builder is pure, so the design's own standing rules -- the
      # greyscale and still-frame tests from docs/VISUAL-LANGUAGE.md -- are
      # executable, and this is what keeps them true.
      - name: Test the interface
        working-directory: ui
        run: npm test

      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          # macos-latest is Apple Silicon, which is the target laptop platform.
          - os: macos-latest
            name: macOS arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # libclang is for bindgen, which builds the keylock bindings; the rest is
      # ALSA and the GTK/WebKit stack Tauri links against.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      # Neither runner has a sound card, which is exactly why dj-audio ships a
      # null backend and an offline renderer. The realtime-safety suite runs
      # here in full.
      - name: Test
        run: cargo test --workspace --all-targets
        env:
          DJMANZO_NULL_AUDIO: "1"

      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Build the application
        run: cargo build --workspace --bin djmanzo
