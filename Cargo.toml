[workspace]
resolver = "3"
members = [
    "crates/dj-core",
    "crates/dj-dsp",
    "crates/dj-audio",
    "crates/dj-decode",
    "crates/dj-engine",
    "crates/dj-control",
    "crates/dj-render",
    "crates/dj-world",
    "crates/dj-secrets",
    "crates/dj-sources",
    "crates/dj-assistant",
    "crates/dj-presets",
    "crates/dj-analysis",
    "crates/dj-library",
    "crates/dj-hid",
    "crates/dj-clap",
    "crates/dj-app",
    "crates/dj-stems",
    "crates/dj-net",
    "crates/dj-dvs",
    "crates/dj-vocal",
]

[workspace.package]
version = "0.40.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joehannes/djmanzo"
authors = ["djmanzo contributors"]

[workspace.dependencies]
dj-core = { path = "crates/dj-core" }
dj-dsp = { path = "crates/dj-dsp" }
dj-vocal = { path = "crates/dj-vocal" }
dj-audio = { path = "crates/dj-audio" }
dj-decode = { path = "crates/dj-decode" }
dj-engine = { path = "crates/dj-engine" }
dj-control = { path = "crates/dj-control" }
dj-render = { path = "crates/dj-render" }
dj-world = { path = "crates/dj-world" }
dj-secrets = { path = "crates/dj-secrets" }
dj-sources = { path = "crates/dj-sources" }
dj-assistant = { path = "crates/dj-assistant" }
dj-presets = { path = "crates/dj-presets" }
dj-clap = { path = "crates/dj-clap" }
dj-analysis = { path = "crates/dj-analysis" }
dj-library = { path = "crates/dj-library" }
dj-hid = { path = "crates/dj-hid" }
dj-stems = { path = "crates/dj-stems" }
dj-net = { path = "crates/dj-net" }
dj-dvs = { path = "crates/dj-dvs" }

cpal = "0.15"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
# Opus, which Symphonia 0.5 cannot decode (§122: a YouTube WebM's sound, an
# .opus file). BSD-3-Clause, pure Rust, no dependencies; chosen over
# `opus-decoder` (MIT/Apache) after both were run against the twelve RFC 8251
# test vectors: both pass decoding to stereo, and this one was 30-60 times
# faster on CELT. See docs/VIDEO.md and dj_decode::opus.
rusty-opus = "1.0.1"
# Keylock. MIT, which is why it is here and Rubber Band is not -- see
# docs/adr/0002-clean-room-permissive-licensing.md. Builds the upstream C++
# through `cc` and generates bindings with `bindgen`, so a C++ compiler and
# libclang are build requirements; see README.md.
signalsmith-stretch = "0.1"
rtrb = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Controller mappings, which are files a DJ edits by hand. MIT OR Apache-2.0.
toml = "0.9"
# MIDI ports. MIT -- see docs/RESEARCH.md. Chosen over the alternatives for
# being a thin wrapper over each platform's own MIDI API (CoreMIDI, ALSA seq,
# WinMM) with no runtime of its own, which is what a callback that has to be
# cheap wants.
midir = { version = "0.11", default-features = false }
# HID, for controllers whose jog wheels need more than seven bits.
#
# The Rust wrapper is MIT. On Linux the backend is chosen per target in
# `crates/dj-hid/Cargo.toml`: `linux-native-basic-udev` is pure Rust
# (basic-udev MIT/Apache-2.0, nix MIT), so a Linux build compiles no C hidapi
# and needs no libudev-dev -- which is what keeps the .deb build buildable on
# a plain machine. macOS uses the vendored C hidapi over IOKit; that library
# is triple-licensed and says so in its own LICENSE.txt -- "The license chosen
# is at the discretion of the user of HIDAPI" -- and djmanzo takes the
# BSD-style one, which ADR-0002 permits. See RESEARCH.md.
hidapi = { version = "2.6", default-features = false }
# Lua, for mappings that need logic rather than a table.
#
# `mlua` is MIT and `vendored` builds Lua 5.4 from source -- also MIT, about
# 200 KB of C with no system dependencies, unlike the libudev question above.
# A C compiler is already a build requirement because keylock builds
# Signalsmith Stretch from C++.
#
# **No standard library reaches a script.** See `crates/dj-hid/src/script.rs`:
# a mapping that could open a file would break the promise that makes a file
# from a stranger safe to open.
mlua = { version = "0.12", default-features = false, features = [
    "lua54",
    "vendored",
    # The script runs on the MIDI thread, so the state has to cross to it.
    "send",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Music sources. `rustls-tls` rather than the system OpenSSL: one fewer thing
# that differs between a developer's Mac and a Xubuntu laptop at a gig.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# Analysis. MIT OR Apache-2.0 -- every open beat-detection library is copyleft
# (see docs/RESEARCH.md), so the algorithms are ours; only the FFT is borrowed.
rustfft = "6"
async-trait = "0.1"
urlencoding = "2"
# PKCE and the sign-in's state for YouTube (§119): the operating system's own
# randomness. Already in the build through `rand`. MIT OR Apache-2.0.
getrandom = "0.3"
# §111: album downloads arrive as .zip. Read, and deflate only: no
# encryption, bzip2, zstd, lzma or xz. MIT. `deflate` is the feature that
# turns flate2 on, and it compiles the zopfli compressor (Apache-2.0) too,
# which nothing calls.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# An embedded HTTP/1.1 server for the pages djmanzo serves to phones in the
# room. Synchronous and thread-per-connection, which matches `dj-net`'s
# existing control server; an async runtime would be a large dependency for
# three routes. See ADR-0010.
tiny_http = "0.12"
# §119: the WebSocket under obs-websocket. No TLS: OBS listens on this
# computer over plain ws://.
tungstenite = "0.30"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# §119: the phone camera page's HTTPS (dj_net::secure). The rustls and ring
# already in the build under reqwest, chosen explicitly: ring rather than
# aws-lc-rs, which would need cmake and NASM to build on Windows. Apache-2.0
# OR ISC OR MIT.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Its requests, read by the parser already here under hyper and tungstenite.
# MIT OR Apache-2.0.
httparse = "1.10"
# djmanzo's own certificate authority for that page (dj_net::authority).
# MIT OR Apache-2.0; brings yasna (MIT OR Apache-2.0). No PEM: only DER is
# written, served and kept.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
# §122 step 7: a pack's Ed25519 signature, made and checked. The ring already
# built above for TLS, with the features it already has.
ring = "0.17"
time = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
tokio = { version = "1", default-features = false }

# The library database. `bundled` compiles SQLite itself rather than linking the
# system one: a DJ's laptop is not a build machine, and a version skew between
# a developer's Mac and a Xubuntu install is exactly the kind of thing that
# surfaces at a gig. It also settles the FTS5 question -- the bundled build has
# it compiled in, which a system SQLite may not. `blob` is for artwork later.
# MIT, which ADR-0002 requires.
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
# Tag reading. MIT OR Apache-2.0, and it covers every container symphonia
# decodes -- ID3, Vorbis comments, MP4 atoms, APE.
lofty = "0.22"
# Content hashing for track identity. CC0-1.0 OR Apache-2.0.
blake3 = "1"
sha2 = "0.10"
# §122: whisper.cpp (MIT), compiled in, for when each word is sung.
# `whisper-rs` and `whisper-rs-sys` are Unlicense. whisper.cpp's CPU flags are
# pinned in `.cargo/config.toml`, not taken from the building machine.
whisper-rs = { version = "0.16", default-features = false, features = ["tracing_backend"] }
tempfile = "3"
# Library imports. Read-only XML tree, MIT OR Apache-2.0. Chosen over
# `quick-xml` because every importer here wants random access to a document
# already in memory, not a streaming parser -- rekordbox playlists reference
# tracks by id, and a plist dict is read by walking siblings in pairs.
roxmltree = "0.20"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The realtime path must not allocate or panic. These lints do not prove that on
# their own -- see crates/dj-engine/tests/rt_safety.rs for the actual check --
# but they catch the obvious cases at compile time.
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
# Line tables rather than full debug info. Backtraces still name the file and
# line -- which is what a failing test is read for -- while the target directory
# stops carrying several gigabytes of DWARF for the GTK and WebKit bindings,
# which nobody has ever stepped through. Set `debug = true` here if you need a
# debugger to inspect variables.
debug = "line-tables-only"

# Dependencies get none at all. A backtrace through `symphonia` or `tauri` is
# read for *our* frames; theirs are noise, and they are the bulk of the bytes.
# Audio work is unusable in a debug build: decoding and DSP are far too slow, so
# dependencies are optimised even in the dev profile.
[profile.dev.package."*"]
opt-level = 3
debug = false
