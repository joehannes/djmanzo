[package]
name = "dj-hid"
description = "Controller mappings for djmanzo: MIDI and HID onto the action bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dj-core = { workspace = true }
dj-control.workspace = true
serde = { workspace = true }
# Mappings are files a DJ edits by hand, so they are TOML rather than JSON:
# comments, trailing commas forgiven, and no quoting every key. MIT OR
# Apache-2.0 — see docs/RESEARCH.md.
toml = { workspace = true }
thiserror = { workspace = true }
midir = { workspace = true }

[lints]
workspace = true

# Pure Rust on Linux: no C hidapi, no libudev-dev to install before building.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { workspace = true, features = ["linux-native-basic-udev"] }

# Everywhere else the crate's own backend: IOKit on macOS, the native API on
# Windows. Neither needs a feature flag.
[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { workspace = true }
