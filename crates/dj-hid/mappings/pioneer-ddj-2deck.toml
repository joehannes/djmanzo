# ============================================================ FEEDBACK
# The controller lights its own buttons from what djmanzo does, on the same
# note numbers it sends -- which is what "Same as MIDI-IN" means in the vendor
# table.

[[feedback]]
when = "deck.1.playing"
send = "note 1 0x0B"

[[feedback]]
when = "deck.2.playing"
send = "note 2 0x0B"

[[feedback]]
when = "deck.1.cue_enabled"
send = "note 1 0x54"

[[feedback]]
when = "deck.2.cue_enabled"
send = "note 2 0x54"
