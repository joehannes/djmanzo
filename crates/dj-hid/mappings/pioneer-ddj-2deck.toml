[[binding]]
on = "note 10 0x11"
press = "deck 2 roll 0.125"
release = "deck 2 roll_off"
[[binding]]
on = "note 10 0x12"
press = "deck 2 roll 0.25"
release = "deck 2 roll_off"
[[binding]]
