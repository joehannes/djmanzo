[package]
name = "dj-app"
description = "The djmanzo desktop application: Tauri host wiring engine, devices and UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "dj_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "djmanzo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri computes `dev = !custom-protocol`, so without this feature declared
# **every** build -- release included -- is a development build that loads the
# interface from `devUrl` instead of embedding `ui/dist`. A packaged app then
# opens on "Could not connect to localhost: Connection refused".
#
# It is deliberately not in `default`: `tauri dev` wants the dev server and its
# hot reload, and `tauri build` turns this on itself. A plain
# `cargo build --release` is therefore *not* a shippable binary -- pass
# `--features custom-protocol`, or build through the Tauri CLI. `xtask` does
# this for you; see docs/BUILD.md.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
dj-core = { workspace = true }
dj-clap = { workspace = true }
dj-audio = { workspace = true }
dj-decode = { workspace = true }
dj-library = { workspace = true }
dj-engine = { workspace = true }
dj-control = { workspace = true }
dj-dsp = { workspace = true }
dj-render = { workspace = true }
dj-world = { workspace = true }
dj-secrets = { workspace = true }
dj-sources = { workspace = true }
dj-assistant = { workspace = true }
dj-presets = { workspace = true }
dj-hid = { workspace = true }
dj-net = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rtrb = { workspace = true }
# Fetching a streamed track to the cache before it reaches a deck. See
# `sources::resolve_source_track` for why it lands on disk first.
reqwest = { workspace = true }
serde = { workspace = true }
dj-analysis = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dj-stems = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
